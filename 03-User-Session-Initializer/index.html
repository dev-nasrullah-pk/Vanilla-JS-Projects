<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IIFE-State-Initializer</title>
    <style>
        body{  
            font-family: "Poppins", sans-serif;
            background-color: #0b0f19;
            color: #f8fafc; 
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .card{
            background-color: #1e293b;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            max-width: 90%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #input-box{
            background-color: #0f172a;
            color: #ffffff;
            border: 1px solid #334155;
            outline: none;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 16px;
        }
        .btn {
            border: none;
        }
        .save-btn{
            padding: 10px 18px;
            border-radius: 6px ;
            background-color: #0284c7;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 10px;
        }
        .save-btn:hover{
            padding: 10px 18px;
            border-radius: 6px ;
            background-color: #0369a1;
        }
        .reset-btn{
            transition: background 0.3s ease;
            background-color: #f43f5e;
            cursor: pointer;
        }
        .reset-btn:hover{
            background-color: #e11d48;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1 class="heading">Welcome, Guest! 👋</h1>
        <input type="text" id="input-box">
        <button class="save-btn btn">Save Name</button>
        <button class="reset-btn btn">Reset Button</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
