<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock | Vanilla JS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .clock-card {
            background-color: #1e293b;
            padding: 35px 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 8px;
            border: none;
            background-color: #22c55e;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-bottom: 25px;
        }

        .btn:hover {
            background-color: #16a34a;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .data-text h2 {
            font-size: 18px;
            color: #94a3b8;
            margin-bottom: 12px;
        }

        .time-display {
            font-size: 32px;
            font-weight: bold;
            color: #4ade80;
            font-family: monospace;
            background-color: #0f172a;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
    </style>
</head>

<body>
    <div class="clock-card">

        <button class="btn">
            Check Live Time
        </button>
        <div class="data-text">
            <p class="data-text">
                Real-Time Digital Clock
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
