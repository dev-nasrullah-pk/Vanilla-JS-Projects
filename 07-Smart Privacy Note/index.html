<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Privacy Note</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap');

        body {
            background-color: #0f0c1b;
            font-family: 'Inter', sans-serif;
            box-sizing: border-box;
            color: #f3f0ff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #1e1735;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 450px;
            padding: 25px;
            border-radius: 6px;
        }

        span {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            background-color: #130f28;
        }

        .save-btn,
        .theme-btn {
            background-color: #8b5cf6;
        }

        .btn {
            cursor: pointer;
            border: none;
            transition: 0.2s background ease;
            padding: 10px 18px;
            border-radius: 6px;
        }

        .save-btn:hover,
        .theme-btn:hover {
            background-color: #7c3aed;
        }

        .clear-btn {
            background-color: #f43f5e;
        }

        .clear-btn:hover {
            background-color: #e11d48;
        }

        #note-title,
        #note-content {
            background: #130f28;
            color: #ffffff;
            border: 1px solid #322558;
            padding: 10px 14px;
            font-size: 15px;
            outline: none;
            border-radius: 8px;
        }

        #note-content {
            resize: none;
        }

        .text {
            font-size: 30px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Smart Privacy Note</h1>
        <span id="status-badge">Session Active</span>
        <input type="text" id="note-title" placeholder="Enter note title...">
        <textarea id="note-content" placeholder="Type your private note here..."></textarea>

        <div class="btn">
            <button class="save-btn btn">Save Note</button>
            <button class="clear-btn btn">Clear Note</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
