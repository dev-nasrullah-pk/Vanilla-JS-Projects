<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Temperature Converter</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: #eef2f3;
            color: black;
        }

        .btn-container {
            margin-bottom: 30px;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #007bff;
            color: white;
            transition: 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        .weather-box {
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            min-width: 300px;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            display: block;
        }
    </style>
</head>

<body>
    <div class="btn-container">
        <button class="city-btn" data-lat="27.5589" data-lon="68.2120" data-name="Larkana">Larkana 🏨</button>
        <button class="city-btn" data-lat="26.4251" data-lon="67.9094" data-name="Sehwan">Sehwan Lal Shahbaz 🕌</button>
        <button class="city-btn" data-lat="24.8607" data-lon="67.0011" data-name="Karachi">Karachi Coast 🌊</button>
    </div>
    <div class="weather-box">
        <p class="data-text">Kesi bhi shehar par click karien live status dekhne ke liye</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
