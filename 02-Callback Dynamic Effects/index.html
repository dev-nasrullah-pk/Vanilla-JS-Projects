<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Script Loader</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #f4f4f4;
        }
        .btn{
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }
        .btn-1{
            padding: 17px 19px;
            background-color: aqua;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            color: black;
            font-size: 17px;
        }
    </style>
</head>
<body>
    <h1>Real world callback demonstration</h1>
    <p class="status">Click the button to load celebration effect from the internet....</p>
    <button class="btn">Celebrate!</button>

    <h1>Grand Celebration Zone</h1>
<p class="info">Click the button bellow start the fireworks...</p>
<button class="btn-1">Ignite  Fireworks</button>

    <script src="script.js"></script>
</body>
</html>
