<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Profile Cards | Vanilla JS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            padding: 40px 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        #profile-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
        }

        .profile-card {
            width: 260px;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0px 12px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.2s ease, box-shodow 0.2s ease;
        }
        .profile-card:hover{
            transform: translateY(-5px);
            box-shadow: 0px 12px 25px rgba(0, 0, 0, 0.5);
        }
        .details{
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .user-name{
            font-size: 22px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 8px;
        }
        .age, .skills{
            font-size: 15px;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <div id="profile-container">

    </div>
    <script src="script.js"></script>
</body>

</html>
