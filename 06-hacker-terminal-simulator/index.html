<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacking Simulator</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Source Code Pro", monospace;
        }

        body {
            background-color: #0d1117;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .terminal-window {
            width: 100%;
            max-width: 800px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 255, 0, 0.15);
            overflow: hidden;
        }
        .terminal-header{
            background-color: #21262d;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            position: relative;
        }
        .buttons{
            display: flex;
            gap: 8px;
        }
        .btn{
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .red{background-color: #ff5f56;}
        .yellow{background-color: #ffbd2e;}
        .green{background-color: #27c93f;}
        .title{
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            color: #8b949e;
            font-size: 13px;
        }
        .terminal-body{
            padding: 20px;
            min-height: 350px;
            color: #2ea043;
            font-size: 16px;
            line-height: 1.6;
        }
        .prompt{
            color: #58a6ff;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <div class="teminal-window">
        <div class="terminal-header">
            <div class="buttons">
                <span class="btn red"></span>
                <span class="btn yellow"></span>
                <span class="btn green"></span>
            </div>
            <div class="title">root@nasrullah-system:~</div>
        </div>
        <div id="terminal" class="terminal-body"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
