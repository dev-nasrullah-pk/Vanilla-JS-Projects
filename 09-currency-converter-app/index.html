<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currenies</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            align-items: center;
        }

        .container {
            max-width: 90%;
            padding: 20px;
            margin: 10px;
        }

        .pkr-btn {
            border-left: green solid 6px;
        }

        .inr-btn {
            border-left: orange solid 6px;
        }

        .sar-btn {
            border-left: #006C35 solid 6px;
        }

        .btn {
            border: none;
            padding: 10px 10px;
            cursor: pointer;
            margin: 10px;
            border-radius: 6px;
        }

        .amount-input {
            padding: 10px 10px;
            font-size: 11px;
        }

        .amount-input {
            padding: 15px;
        }
    </style>
</head>

<body>
    <div class="container">

        <input type="number" class="amount-input" placeholder="Enter USD Amount" value="1">
        <button class="pkr-btn btn">Convert To PKR</button>
        <button class="inr-btn btn">Convert To INR</button>
        <button class="sar-btn btn">Convert To SAR</button>

        <div class="show">

            <p class="loading"></p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
