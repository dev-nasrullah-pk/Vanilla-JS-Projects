<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <title>Savoria | Premium Culinary Menu</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --card-bg: #1e293b;
            --accent: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .hero {
            text-align: center;
            padding: 40px 20px 20px;
        }

        .hero h1 {
            font-size: 2.8rem;
            color: var(--accent);
            letter-spacing: 2px;
        }

        .tagline {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 5px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .filter-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 40px;
        }

        .filter-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border);
            padding: 10px 22px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .filter-btn:hover,
        .filter-btn-active {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.8);
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fil, minmax(280px, 1fr));
            gap: 25px;
        }

        .menu-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .menu-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.2rem;
        }

        .price {
            color: var(--accent);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .category-tag {
            display: inline-block;
            font-size: 0.75rem;
            background: rgba(245, 158, 11, 0.15);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 12px;
            width: fit-content;
            margin-bottom: 10px;
        }
        .descriptoion{
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.4;
        }
    </style>
</head>

<body>
    <header class="hero">
        <h1>Savoria</h1>
        <p class="tagline">Artisanal Bistro & Cafe • Crafted with Passion</p>
    </header>
    <main class="container">
        <!-- Filter Buttons Container -->
        <div class="filter-container">
            <button class="filter-btn active" data-="All">All</button>
            <button class="filter-btn">Starters</button>
            <button class="filter-btn">Fast Food</button>
            <button class="filter-btn">Desi Special</button>
            <button class="filter-btn">Beverages</button>
            <button class="filter-btn">Desserts</button>
        </div>
        <!-- Menu Cards Grid-->
        <div class="menu-Grid" id="menu-container"></div>
    </main>
    <script src="script.js"></script>
</body>

</html>
