<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dyanamic Isalnd Cards</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        .container {
            margin: 20px 0px 20px 20px;
            height: 165px;
            width: 70vw;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.05);
            overflow: hidden;
            display: flex;
            border-radius: 12px;
            background-color: #ffffff;
        }

        .left {
            width: 35%;
            height: 100%;
            position: relative;

        }

        .left .img {
            width: 100%;
            height: 100%;
        }

        .left .img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-top-left-radius: 7px;
            border-bottom-left-radius: 7px;
        }

        .left .img .duration {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            padding: 3px;
            border-radius: 10px;
            font-size: 18px;
        }

        .right {
            width: 65%;
            height: 100%;
            padding: 20px;
        }

        .right .title h3 {
            margin: 0;
            margin-top: 4px;
        }

        .right .video-data {
            font-size: 15px;
        }
    </style>
</head>

<body>
    <script src="script.js"></script>
</body>

</html>
